spring.application.name=th02
server.port=9999

# Mac dinh chay CSDL tich hop che do MySQL (du lieu luu tru vao thu muc ./data)
# Khong can cai dat truoc van chay duoc 100%
spring.datasource.url=jdbc:h2:file:./data/WebBanHang;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Giao dien quan ly CSDL truc quan (giong phpMyAdmin / HeidiSQL) tai http://localhost:9999/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true