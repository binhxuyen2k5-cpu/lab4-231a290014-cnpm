<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Bán Hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .top-navbar {
            background-color: #f59e0b;
            padding: 12px 24px;
        }
        .top-navbar .nav-btn {
            background-color: #ea580c;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            padding: 8px 18px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s;
        }
        .top-navbar .nav-btn:hover {
            background-color: #c2410c;
            color: white;
        }
        .top-navbar .nav-link-item {
            color: white;
            font-weight: 500;
            text-decoration: none;
            margin-right: 20px;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .top-navbar .nav-link-item:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
    </style>
</head>
<body>
    <header class="top-navbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center">
            <a th:href="@{/categories}" class="nav-btn me-3">
                &#9776; Quản Lý Danh Mục
            </a>
            <a th:href="@{/products}" class="nav-btn">
                &#128722; Quản Lý Sản Phẩm
            </a>
        </div>
        <div class="d-flex align-items-center">
            <a th:href="@{/categories/add}" class="nav-btn me-2">
                + Nhập Danh Mục
            </a>
            <a th:href="@{/products/add}" class="nav-btn">
                + Nhập Sản Phẩm
            </a>
        </div>
    </header>

    <main>
        <section layout:fragment="content">
            <!-- Content page injected here -->
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
